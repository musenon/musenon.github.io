<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>色水ソート</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #35406e;
        background-image: radial-gradient(ellipse 90% 55% at 50% -5%, #4a5a99 0%, #35406e 60%);
        color: #eef1ff;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap { max-width: 600px; margin: 0 auto; padding: 14px 14px 40px; }

      /* ---------- HUD ---------- */
      .hud {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 8px;
      }
      .hud-level { display: flex; align-items: center; gap: 8px; }
      .hud-level label { font-size: 13px; color: #b9c4ee; font-weight: 700; }
      select#levelSelect {
        font: inherit; font-weight: 800; font-size: 15px;
        background: transparent; color: #ffd94d;
        border: 1px solid rgba(160,185,255,.3); border-radius: 999px;
        min-height: 36px; padding: 2px 8px;
      }
      .spacer { flex: 1; }
      .icon-btn {
        font: inherit; font-weight: 700; font-size: 13px;
        background: transparent; color: #cfd8ff;
        border: 1px solid rgba(160,185,255,.3); border-radius: 999px;
        padding: 6px 12px; min-height: 36px; cursor: pointer;
      }
      .icon-btn:active { transform: scale(.96); }

      /* ---------- Controls (minimal) ---------- */
      .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
      .ctl {
        font: inherit; font-weight: 700; font-size: 13px;
        min-height: 38px; padding: 6px 13px;
        border-radius: 999px; cursor: pointer;
        background: transparent; color: #cfd8ff;
        border: 1px solid rgba(160,185,255,.3);
        transition: opacity .2s, background .15s;
        white-space: nowrap;
      }
      .ctl:active { background: rgba(160,185,255,.14); }
      .ctl:disabled { opacity: .35; cursor: default; }
      .menu-wrap { position: relative; margin-left: auto; }
      .menu {
        position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
        background: #232c52; border: 1px solid rgba(160,185,255,.3);
        border-radius: 12px; padding: 6px; min-width: 148px;
        display: flex; flex-direction: column; gap: 4px;
        box-shadow: 0 10px 28px rgba(0,0,0,.45);
      }
      .menu[hidden] { display: none; }
      .menu .ctl { border: none; text-align: left; }
      .menu-credit {
        margin: 4px 6px 2px; padding-top: 7px;
        border-top: 1px solid rgba(160,185,255,.18);
        font-size: 10.5px; line-height: 1.5; color: #8b9bd4; font-weight: 500;
      }
      .win-card .ctl { background: #f2f4ff; color: #2c3763; border: none; flex: 1 1 auto; }
      .win-card .ctl.accent { background: #ffd94d; color: #5a4300; }

      /* ---------- Board & bottles ---------- */
      #board {
        position: relative;
        display: grid; justify-content: center; align-content: start;
        gap: 20px 10px; padding: 18px 2px 8px;
        --bw: 60px;
      }
      .bottle {
        position: relative;
        width: var(--bw);
        height: calc(var(--bw) * 2.18);
        background: none; border: none; padding: 0; cursor: pointer;
        font: inherit;
        transition: transform .18s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .bottle:focus-visible { outline: 3px solid #ffd94d; outline-offset: 4px; border-radius: 10px; }
      .bottle.selected { transform: translateY(calc(var(--bw) * -0.28)); }
      .bottle.shake { animation: shake .3s ease; }
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .bottle.pouring { transition: transform .34s cubic-bezier(.3,1.25,.45,1); z-index: 30; }
      .bottle.done { cursor: default; }

      /* ---------- Watery pour effects ---------- */
      /* liquid sloshes inside the tilted bottle */
      .bottle.pouring .layers { animation: slosh .26s ease-in-out infinite alternate; transform-origin: 50% 100%; }
      @keyframes slosh {
        from { transform: rotate(-1.8deg) translateX(-1px); }
        to   { transform: rotate(1.8deg) translateX(1px); }
      }
      /* receiving bottle bobs gently while water flows in */
      .bottle.receiving { animation: recvBob .3s ease-in-out infinite alternate; }
      @keyframes recvBob {
        from { transform: translateY(0); }
        to   { transform: translateY(2px); }
      }
      /* the surface of the receiving liquid swells and dips while water lands on it */
      .bottle.receiving .layers .layer.top {
        animation: surfBounce .28s ease-in-out infinite alternate;
        transform-origin: 50% 100%;
      }
      @keyframes surfBounce {
        from { transform: scaleY(1) translateX(0); }
        to   { transform: scaleY(1.14) translateX(.6px); }
      }
      /* ripple rings spreading across the surface where the stream lands */
      .ripple {
        position: absolute; z-index: 26; pointer-events: none;
        height: 9px; border: 2px solid rgba(255,255,255,.8);
        border-radius: 50%;
        transform: translate(-50%, -50%) scaleX(.18);
        animation: rippleOut .62s ease-out forwards;
      }
      @keyframes rippleOut {
        0% { transform: translate(-50%, -50%) scaleX(.18) scaleY(.6); opacity: .95; }
        100% { transform: translate(-50%, -50%) scaleX(1) scaleY(1.15); opacity: 0; }
      }
      /* after a pour the surface settles with a wobble */
      .bottle.settle .layers { animation: settle .6s ease-out; transform-origin: 50% 100%; }
      @keyframes settle {
        0% { transform: scaleY(1) rotate(0deg); }
        30% { transform: scaleY(1.045) rotate(.7deg); }
        55% { transform: scaleY(.985) rotate(-.5deg); }
        78% { transform: scaleY(1.015) rotate(.25deg); }
        100% { transform: scaleY(1) rotate(0deg); }
      }
      /* glossy surface on the top layer of liquid */
      .layers .layer.top { position: relative; }
      .layers .layer.top::after {
        content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30%;
        background: radial-gradient(ellipse 95% 100% at 50% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 72%);
        border-radius: 50%;
      }
      /* the stream of water between the bottles */
      .stream {
        position: absolute; z-index: 25; pointer-events: none;
        border-radius: 999px;
        transform-origin: 50% 0;
        box-shadow: inset 0 0 3px rgba(255,255,255,.45);
        animation: streamIn .16s ease-out, streamFlow .15s linear infinite, streamPulse .22s ease-in-out infinite alternate;
      }
      @keyframes streamIn { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: .92; } }
      @keyframes streamFlow { from { background-position: 0 0; } to { background-position: 0 17px; } }
      @keyframes streamPulse { from { filter: brightness(1); } to { filter: brightness(1.18); } }
      /* splash droplets at the receiving bottle's mouth */
      .droplet {
        position: absolute; z-index: 26; pointer-events: none;
        border-radius: 50%;
        animation: dropFly .55s ease-out forwards;
      }
      @keyframes dropFly {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        55% { transform: translate(calc(var(--dx) * .7), var(--dy)) scale(.85); opacity: 1; }
        100% { transform: translate(var(--dx), 16px) scale(.35); opacity: 0; }
      }
      /* bubbles rising inside the receiving bottle */
      .bubble {
        position: absolute; z-index: 4; pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%, rgba(255,255,255,.95), rgba(255,255,255,.22) 70%);
        animation: bubbleRise .75s ease-in forwards;
      }
      @keyframes bubbleRise {
        0% { transform: translateY(0) scale(.6); opacity: 0; }
        20% { opacity: .95; }
        100% { transform: translateY(-34px) scale(1.05); opacity: 0; }
      }

      .glass {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: calc(var(--bw) * 1.94);
        border: calc(var(--bw) * 0.05) solid rgba(186, 216, 255, .8);
        border-top: none;
        border-radius: 0 0 calc(var(--bw) * 0.42) calc(var(--bw) * 0.42) / 0 0 calc(var(--bw) * 0.3) calc(var(--bw) * 0.3);
        background: linear-gradient(100deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.03) 35%, rgba(255,255,255,.10) 70%, rgba(255,255,255,.02) 100%);
        box-shadow: inset 0 0 0 1px rgba(20,30,70,.25), 0 4px 10px rgba(10,16,40,.35);
      }
      /* neck / mouth */
      .glass::before {
        content: ""; position: absolute;
        top: calc(var(--bw) * -0.30); left: 50%; transform: translateX(-50%);
        width: 52%; height: calc(var(--bw) * 0.30);
        border: calc(var(--bw) * 0.05) solid rgba(186, 216, 255, .8);
        border-bottom: none;
        border-radius: calc(var(--bw) * 0.08) calc(var(--bw) * 0.08) 0 0;
        background: linear-gradient(100deg, rgba(255,255,255,.13), rgba(255,255,255,.03) 60%, rgba(255,255,255,.10));
      }
      .glass::after {
        content: ""; position: absolute;
        top: calc(var(--bw) * -0.36); left: 50%; transform: translateX(-50%);
        width: 62%; height: calc(var(--bw) * 0.10);
        border: calc(var(--bw) * 0.045) solid rgba(186, 216, 255, .85);
        border-radius: 999px;
        background: rgba(255,255,255,.08);
      }
      .layers {
        position: absolute; left: 5%; right: 5%; bottom: 3.5%;
        height: 84%;
        display: flex; flex-direction: column-reverse;
        border-radius: 0 0 calc(var(--bw) * 0.34) calc(var(--bw) * 0.34) / 0 0 calc(var(--bw) * 0.22) calc(var(--bw) * 0.22);
        overflow: hidden;
      }
      .layer {
        flex: 0 0 25%; width: 100%;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.18);
      }
      .shine {
        position: absolute; top: 6%; bottom: 8%; left: 13%;
        width: 13%; border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.06));
        pointer-events: none;
      }
      .cork {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(var(--bw) * -0.02);
        width: 46%; height: calc(var(--bw) * 0.34);
        border-radius: calc(var(--bw) * 0.09) calc(var(--bw) * 0.09) calc(var(--bw) * 0.04) calc(var(--bw) * 0.04);
        background: linear-gradient(100deg, #c98f4e, #e8b878 45%, #d29c58);
        box-shadow: inset 0 -3px 0 rgba(120,70,10,.35), 0 2px 4px rgba(0,0,0,.3);
        opacity: 0; pointer-events: none; z-index: 5;
      }
      .bottle.done .cork { opacity: 1; }
      .bottle.done .glass { border-color: rgba(255, 217, 77, .75); }
      .sparkle {
        position: absolute; left: 50%; top: 30%; z-index: 6;
        font-size: calc(var(--bw) * 0.5); color: #ffd94d;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none; font-style: normal;
      }
      .bottle.just-done .sparkle { animation: spark .7s ease-out; }
      @keyframes spark {
        0% { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 1; }
        60% { transform: translate(-50%,-90%) scale(1.3) rotate(30deg); opacity: 1; }
        100% { transform: translate(-50%,-130%) scale(1.5) rotate(50deg); opacity: 0; }
      }

      /* ---------- Win overlay ---------- */
      #winOverlay {
        position: fixed; inset: 0; z-index: 100;
        background: rgba(14, 18, 40, .72);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
      }
      #winOverlay[hidden] { display: none; }
      .win-card {
        position: relative; overflow: hidden;
        background: #2c3763; border: 1px solid rgba(160,185,255,.35);
        border-radius: 20px; padding: 30px 26px 26px;
        text-align: center; max-width: 360px; width: 100%;
        box-shadow: 0 18px 50px rgba(0,0,0,.5);
      }
      .win-card .big { font-size: 34px; font-weight: 800; margin: 0 0 6px; color: #ffd94d; }
      .win-card p { margin: 0 0 20px; color: #cdd6fb; font-weight: 700; }
      .win-card .row { display: flex; gap: 10px; }
      .confetti { position: absolute; top: -12px; width: 9px; height: 15px; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }
      @keyframes fall { to { transform: translateY(420px) rotate(720deg); opacity: .9; } }

      @media (prefers-reduced-motion: reduce) {
        .bottle, .bottle.pouring { transition: none; }
        .bottle.shake, .bottle.just-done .sparkle, .confetti,
        .bottle.pouring .layers, .bottle.receiving, .bottle.settle .layers,
        .bottle.receiving .layers .layer.top,
        .stream, .droplet, .bubble, .ripple { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="hud-level">
          <label for="levelSelect">レベル</label>
          <select id="levelSelect" aria-label="レベルを選ぶ"></select>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">音：ON</button>
      </div>

      <div class="controls">
        <button class="ctl" id="undoBtn" type="button">↩ もどす</button>
        <div class="menu-wrap">
          <button class="ctl" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="その他の操作">⋯</button>
          <div class="menu" id="menu" hidden>
            <button class="ctl" id="restartBtn" type="button">はじめから</button>
            <button class="ctl" id="newBtn" type="button">別の問題</button>
            <p class="menu-credit">注ぎ音：Freesound「Pouring Glass of Wine from Bottle」（CC BY）</p>
          </div>
        </div>
      </div>

      <main id="board" aria-label="瓶のパズル盤面"></main>
    </div>

    <div id="winOverlay" hidden>
      <div class="win-card" id="winCard">
        <p class="big">クリア！</p>
        <p id="winText">レベル1 をそろえたよ</p>
        <div class="row">
          <button class="ctl" id="againBtn" type="button">もう一度</button>
          <button class="ctl accent" id="nextBtn" type="button">次のレベルへ →</button>
        </div>
      </div>
    </div>

    <script>
      'use strict';
      var CAP = 4;
      var COLORS = [
        { name: 'オレンジ', c: '#ff7d1e', dark: '#d95f06', light: '#ffb066' },
        { name: 'みどり',   c: '#2fbf3f', dark: '#1d9429', light: '#7ce787' },
        { name: 'あお',     c: '#2596e6', dark: '#1668ab', light: '#7cc4f5' },
        { name: 'しろ',     c: '#f4f4f6', dark: '#c9c9d6', light: '#ffffff' },
        { name: 'くろ',     c: '#34344c', dark: '#1d1d2e', light: '#5f5f82' },
        { name: 'ピンク',   c: '#ff5da2', dark: '#d63a7e', light: '#ff9cc4' },
        { name: 'きいろ',   c: '#ffc61a', dark: '#d99e00', light: '#ffe066' },
        { name: 'むらさき', c: '#9b5de5', dark: '#7436bd', light: '#c39bf5' },
        { name: 'みずいろ', c: '#19c2d8', dark: '#0e8fa1', light: '#6fe3f2' },
        { name: 'あか',     c: '#f04438', dark: '#b92c22', light: '#ff8a80' }
      ];
      var LEVEL_COLORS = [4, 5, 5, 6, 6, 7, 7, 8, 8, 9];
      var MAX_LEVEL = LEVEL_COLORS.length;

      var boardEl = document.getElementById('board');
      var levelSelect = document.getElementById('levelSelect');
      var undoBtn = document.getElementById('undoBtn');
      var winOverlay = document.getElementById('winOverlay');
      var winText = document.getElementById('winText');
      var winCard = document.getElementById('winCard');

      var level = 1;
      var bottles = [];        // array of arrays, bottom -> top, color indices
      var initialBottles = [];
      var selected = -1;
      var undoStack = [];        // snapshots {bottles, extraUsed}
      var extraUsed = false;
      var animating = false;
      var soundOn = true;
      var justDoneIdx = -1;

      for (var li = 1; li <= MAX_LEVEL; li++) {
        var opt = document.createElement('option');
        opt.value = String(li);
        opt.textContent = 'レベル ' + li + '（' + LEVEL_COLORS[li - 1] + '色）';
        levelSelect.appendChild(opt);
      }

      /* ---------------- Audio ---------------- */
      var audioCtx = null;
      function ac() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }
      function tone(freqFrom, freqTo, dur, type, gain, delay) {
        if (!soundOn) return;
        var ctx = ac(); if (!ctx) return;
        var t = ctx.currentTime + (delay || 0);
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freqFrom, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(freqTo, 1), t + dur);
        g.gain.setValueAtTime(gain || 0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + dur + 0.02);
      }

      function sndPour(amount) {
        if (!soundOn) return;
        var ctx = ac(); if (!ctx) return;
        if (!pourBuf) { loadPourBuffer(); return; }
        var t = ctx.currentTime;
        // the visible flow runs ~0.74s (from tilt at 280ms to the swap at 1020ms);
        // fade the recording out over the last stretch so it ends with the animation
        var playDur = 0.82;
        var maxOffset = Math.max(pourBuf.duration - playDur - 0.05, 0);
        var offset = Math.random() * Math.min(maxOffset, 0.9);
        var src = ctx.createBufferSource();
        src.buffer = pourBuf;
        src.playbackRate.value = 0.97 + Math.random() * 0.06;
        var g = ctx.createGain();
        var vol = 0.5;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
        g.gain.setValueAtTime(vol, t + Math.max(playDur - 0.2, 0.05));
        g.gain.exponentialRampToValueAtTime(0.0001, t + playDur);
        src.connect(g); g.connect(ctx.destination);
        src.start(t, offset, playDur + 0.05);
      }

          .catch(function () { winLoading = false; });
      }
      function sndWin() {
        if (!soundOn) return;
        var ctx = ac(); if (!ctx) return;
        if (!winBuf) { loadWinBuffer(); return; }
        var src = ctx.createBufferSource();
        src.buffer = winBuf;
        var g = ctx.createGain();
        g.gain.value = 0.9;
        src.connect(g); g.connect(ctx.destination);
        src.start(ctx.currentTime);
      }

      /* ---------------- Solver ---------------- */
      function isCompleteBottle(b) {
        return b.length === CAP && b.every(function (c) { return c === b[0]; });
      }
      function isSolvedState(s) {
        return s.every(function (b) { return b.length === 0 || isCompleteBottle(b); });
      }
      function topRun(b) {
        var c = b[b.length - 1], n = 0;
        for (var i = b.length - 1; i >= 0 && b[i] === c; i--) n++;
        return n;
      }
      function stateKey(s) {
        return s.map(function (b) { return b.join(','); }).sort().join('|');
      }
      function heuristic(s) {
        var h = 0;
        for (var k = 0; k < s.length; k++) {
          var b = s[k];
          if (b.length === 0) continue;
          if (isCompleteBottle(b)) continue;
          h += 3;
          for (var i = 1; i < b.length; i++) if (b[i] !== b[i - 1]) h += 2;
          // units buried under a different color
          var seenTop = b[b.length - 1];
          for (var j = 0; j < b.length - 1; j++) if (b[j] !== seenTop) h += 0; // placeholder keep simple
        }
        return h;
      }
      function legalMoves(s) {
        var moves = [], firstEmpty = -1, i, j;
        for (i = 0; i < s.length; i++) if (s[i].length === 0) { firstEmpty = i; break; }
        for (i = 0; i < s.length; i++) {
          var src = s[i];
          if (src.length === 0 || isCompleteBottle(src)) continue;
          var run = topRun(src), color = src[src.length - 1];
          for (j = 0; j < s.length; j++) {
            if (j === i) continue;
            var dst = s[j];
            if (dst.length >= CAP) continue;
            var score;
            if (dst.length === 0) {
              if (j !== firstEmpty) continue;
              if (run === src.length) continue; // moving a uniform bottle to empty is pointless
              score = 2;
            } else if (dst[dst.length - 1] === color) {
              var amount = Math.min(run, CAP - dst.length);
              var completes = (dst.length + amount === CAP) &&
                dst.every(function (c) { return c === color; });
              score = completes ? 0 : 1;
            } else continue;
            moves.push({ i: i, j: j, score: score });
          }
        }
        moves.sort(function (a, b) { return a.score - b.score; });
        return moves;
      }
      function applyMove(s, i, j) {
        var ns = s.map(function (b) { return b.slice(); });
        var src = ns[i], dst = ns[j];
        var color = src[src.length - 1];
        var amount = Math.min(topRun(src), CAP - dst.length);
        for (var k = 0; k < amount; k++) dst.push(src.pop());
        return ns;
      }
      // Greedy best-first search; returns array of [i,j] or null.
      function solve(initial, limit) {
        if (isSolvedState(initial)) return [];
        var visited = {};
        visited[stateKey(initial)] = true;
        // simple binary heap on (h + depth*0.15)
        var heap = [];
        function push(node) {
          heap.push(node);
          var idx = heap.length - 1;
          while (idx > 0) {
            var p = (idx - 1) >> 1;
            if (heap[p].pri <= heap[idx].pri) break;
            var tmp = heap[p]; heap[p] = heap[idx]; heap[idx] = tmp; idx = p;
          }
        }
        function pop() {
          var top = heap[0], last = heap.pop();
          if (heap.length) {
            heap[0] = last;
            var idx = 0;
            for (;;) {
              var l = idx * 2 + 1, r = l + 1, m = idx;
              if (l < heap.length && heap[l].pri < heap[m].pri) m = l;
              if (r < heap.length && heap[r].pri < heap[m].pri) m = r;
              if (m === idx) break;
              var tmp = heap[m]; heap[m] = heap[idx]; heap[idx] = tmp; idx = m;
            }
          }
          return top;
        }
        push({ s: initial, path: [], pri: heuristic(initial) });
        var expanded = 0;
        while (heap.length) {
          var node = pop();
          if (isSolvedState(node.s)) return node.path;
          if (++expanded > limit) return null;
          var ms = legalMoves(node.s);
          for (var k = 0; k < ms.length; k++) {
            var ns = applyMove(node.s, ms[k].i, ms[k].j);
            var key = stateKey(ns);
            if (visited[key]) continue;
            visited[key] = true;
            var np = node.path.concat([[ms[k].i, ms[k].j]]);
            push({ s: ns, path: np, pri: heuristic(ns) + np.length * 0.15 });
          }
        }
        return null;
      }

      /* ---------------- Level generation (solver-verified) ---------------- */
      function shuffled(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function generate(numColors) {
        var limit = numColors <= 6 ? 150000 : (numColors === 7 ? 250000 : 400000);
        var fallback = null;
        for (var attempt = 0; attempt < 60; attempt++) {
          var pool = [];
          for (var c = 0; c < numColors; c++) for (var k = 0; k < CAP; k++) pool.push(c);
          pool = shuffled(pool);
          var state = [];
          for (var b = 0; b < numColors; b++) state.push(pool.slice(b * CAP, b * CAP + CAP));
          state.push([], []);
          // skip near-solved / already-uniform bottles dominating
          var uniform = state.filter(function (x) { return x.length === CAP && x.every(function (v) { return v === x[0]; }); }).length;
          if (uniform > 0) { fallback = fallback || state; continue; }
          var sol = solve(state, limit);
          if (sol && sol.length >= numColors + 2) return state;
          fallback = fallback || state;
        }
        return fallback;
      }

      /* ---------------- Rendering ---------------- */
      function layerHTML(colorIdx, isTop) {
        var col = COLORS[colorIdx];
        return '<span class="layer' + (isTop ? ' top' : '') + '" style="background:linear-gradient(90deg,' +
          col.dark + ' 0%,' + col.c + ' 32%,' + col.light + ' 52%,' + col.c + ' 78%,' + col.dark + ' 100%)"></span>';
      }
      function bottleLabel(idx) {
        var b = bottles[idx];
        if (b.length === 0) return '瓶' + (idx + 1) + '：空っぽ';
        var names = b.map(function (c) { return COLORS[c].name; });
        return '瓶' + (idx + 1) + '：下から ' + names.join('、');
      }
      function render() {
        boardEl.innerHTML = '';
        layout();
        bottles.forEach(function (b, idx) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'bottle' +
            (idx === selected ? ' selected' : '') +
            (isCompleteBottle(b) ? ' done' : '') +
            (idx === justDoneIdx ? ' just-done' : '');
          btn.setAttribute('aria-label', bottleLabel(idx));
          var layers = b.map(function (c, li) { return layerHTML(c, li === b.length - 1); }).join('');
          btn.innerHTML =
            '<span class="cork"></span>' +
            '<i class="sparkle">✦</i>' +
            '<span class="glass"><span class="layers">' + layers + '</span><span class="shine"></span></span>';
          btn.addEventListener('click', function () { onTap(idx); });
          boardEl.appendChild(btn);
        });
        undoBtn.disabled = undoStack.length === 0 || animating;
      }
      function layout() {
        var n = bottles.length || 6;
        var vw = Math.min(window.innerWidth, 600);
        var cols;
        if (window.innerWidth >= 640) cols = Math.min(6, Math.ceil(n / 2));
        else cols = n <= 6 ? 3 : (n <= 8 ? 4 : 5);
        var gap = 10;
        var bw = Math.floor(Math.min(66, Math.max(42, (vw - 28 - (cols - 1) * gap) / cols)));
        boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + bw + 'px)';
        boardEl.style.setProperty('--bw', bw + 'px');
      }
      window.addEventListener('resize', layout);

      function deepCopy(s) { return s.map(function (b) { return b.slice(); }); }

      /* ---------------- Game flow ---------------- */
      function startLevel(lv, keepMessage) {
        level = lv;
        levelSelect.value = String(lv);
        winOverlay.hidden = true;
        // defer the (sometimes heavy) generation so the tap responds first
        setTimeout(function () {
          bottles = generate(LEVEL_COLORS[lv - 1]);
          initialBottles = deepCopy(bottles);
          selected = -1; undoStack = []; extraUsed = false;
          justDoneIdx = -1; animating = false;
          render();
        }, 30);
      }

      function canPour(i, j) {
        var src = bottles[i], dst = bottles[j];
        if (i === j || src.length === 0 || dst.length >= CAP) return false;
        if (isCompleteBottle(src)) return false;
        return dst.length === 0 || dst[dst.length - 1] === src[src.length - 1];
      }

      function onTap(idx) {
        if (animating) return;
        ac();
        loadPourBuffer();
        loadWinBuffer();
        if (selected === -1) {
          if (bottles[idx].length === 0) { return; }
          if (isCompleteBottle(bottles[idx])) { return; }
          selected = idx; sndSelect(); render();
          return;
        }
        if (selected === idx) { selected = -1; render(); return; }
        if (!canPour(selected, idx)) {
          // tapping another non-empty bottle switches selection
          if (bottles[idx].length > 0 && !isCompleteBottle(bottles[idx])) {
            selected = idx; sndSelect(); render();
          } else {
            sndBad();
            var el = boardEl.children[idx];
            if (el) { el.classList.add('shake'); setTimeout(function () { el.classList.remove('shake'); }, 320); }
          }
          return;
        }
        doPour(selected, idx);
      }

      /* ---- water stream / splash / bubble helpers ---- */
      /* Y (relative to the board) of the liquid surface in a bottle that
         currently holds `fill` layers — the stream must land here, on the
         water already in the bottle, not at the bottle's mouth. */
      function liquidSurfaceY(dstEl, fill) {
        var br = boardEl.getBoundingClientRect();
        var layersEl = dstEl.querySelector('.layers');
        if (!layersEl) return dstEl.getBoundingClientRect().top - br.top;
        var lr = layersEl.getBoundingClientRect();
        return (lr.bottom - br.top) - fill * (lr.height / CAP);
      }
      function makeStream(dstEl, col, surfStartY, surfEndY) {
        var br = boardEl.getBoundingClientRect();
        var dr = dstEl.getBoundingClientRect();
        var el = document.createElement('span');
        el.className = 'stream';
        var w = Math.max(dr.width * 0.15, 7);
        var topY = dr.top - br.top - dr.width * 0.82;
        el.style.left = (dr.left - br.left + dr.width / 2 - w / 2) + 'px';
        el.style.top = topY + 'px';
        el.style.width = w + 'px';
        el.style.height = Math.max(surfStartY - topY, 4) + 'px';
        el.style.backgroundImage = 'repeating-linear-gradient(180deg,' +
          col.c + ' 0 7px,' + col.light + ' 7px 10px,' + col.c + ' 10px 17px)';
        el.style.opacity = '0.92';
        boardEl.appendChild(el);
        // as the bottle fills, the surface rises — the stream's tip follows it up
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.style.transition = 'height .66s linear';
            el.style.height = Math.max(surfEndY - topY, 4) + 'px';
          });
        });
        return el;
      }
      function spawnDroplets(dstEl, col, surfY) {
        var br = boardEl.getBoundingClientRect();
        var dr = dstEl.getBoundingClientRect();
        for (var k = 0; k < 8; k++) {
          var d = document.createElement('span');
          d.className = 'droplet';
          var size = 4 + Math.random() * 5;
          d.style.width = size + 'px';
          d.style.height = size + 'px';
          d.style.left = (dr.left - br.left + dr.width / 2 - size / 2 + (Math.random() * 10 - 5)) + 'px';
          d.style.top = (surfY - size / 2) + 'px';
          d.style.background = col.light;
          d.style.setProperty('--dx', (Math.random() * 52 - 26).toFixed(0) + 'px');
          d.style.setProperty('--dy', (-(6 + Math.random() * 16)).toFixed(0) + 'px');
          d.style.animationDelay = (Math.random() * 0.3) + 's';
          boardEl.appendChild(d);
          (function (el) { setTimeout(function () { el.remove(); }, 1000); })(d);
        }
      }
      /* ripple rings on the receiving surface while the stream lands */
      function spawnRipples(dstEl, surfStartY, surfEndY) {
        var br = boardEl.getBoundingClientRect();
        var dr = dstEl.getBoundingClientRect();
        var cx = dr.left - br.left + dr.width / 2;
        var rw = dr.width * 0.8;
        [0.1, 0.45, 0.8].forEach(function (frac, n) {
          setTimeout(function () {
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.left = cx + 'px';
            r.style.top = (surfStartY + (surfEndY - surfStartY) * frac) + 'px';
            r.style.width = rw + 'px';
            boardEl.appendChild(r);
            setTimeout(function () { r.remove(); }, 700);
          }, n * 210);
        });
      }
      function spawnBubbles(dstEl) {
        var glass = dstEl.querySelector('.glass');
        if (!glass) return;
        for (var k = 0; k < 6; k++) {
          var b = document.createElement('span');
          b.className = 'bubble';
          var size = 4 + Math.random() * 6;
          b.style.width = size + 'px';
          b.style.height = size + 'px';
          b.style.left = (18 + Math.random() * 58) + '%';
          b.style.bottom = (8 + Math.random() * 30) + '%';
          b.style.animationDelay = (Math.random() * 0.35) + 's';
          glass.appendChild(b);
          (function (el) { setTimeout(function () { el.remove(); }, 1300); })(b);
        }
      }

      function doPour(i, j) {
        animating = true;
        var srcEl = boardEl.children[i];
        var dstEl = boardEl.children[j];
        undoStack.push({ bottles: deepCopy(bottles), extraUsed: extraUsed });

        var colorIdx = bottles[i][bottles[i].length - 1];
        var col = COLORS[colorIdx];
        var amount = Math.min(topRun(bottles[i]), CAP - bottles[j].length);
        var streamEl = null;

        if (srcEl && dstEl) {
          var sr = srcEl.getBoundingClientRect();
          var dr = dstEl.getBoundingClientRect();
          var dx = (dr.left + dr.width / 2) - (sr.left + sr.width / 2);
          var dy = dr.top - sr.top - sr.height * 0.52;
          var deg = dx >= 0 ? 103 : -103;
          srcEl.classList.add('pouring');
          srcEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + deg + 'deg)';
          srcEl.style.transformOrigin = '50% 10%';
          srcEl.style.zIndex = '30';
          dstEl.classList.add('receiving');
        }
        // once the bottle is tilted, the water starts to flow — down to the
        // surface of the liquid already in the destination bottle
        setTimeout(function () {
          sndPour(amount);
          if (dstEl) {
            var fillBefore = bottles[j].length;
            var surfStartY = liquidSurfaceY(dstEl, fillBefore);
            var surfEndY = liquidSurfaceY(dstEl, fillBefore + amount);
            streamEl = makeStream(dstEl, col, surfStartY, surfEndY);
            spawnDroplets(dstEl, col, surfStartY);
            spawnRipples(dstEl, surfStartY, surfEndY);
            spawnBubbles(dstEl);
          }
        }, 280);
        setTimeout(function () {
          if (streamEl) streamEl.remove();
          var wasComplete = isCompleteBottle(bottles[j]);
          bottles = applyMove(bottles, i, j);
          selected = -1;
          animating = false;
          justDoneIdx = (!wasComplete && isCompleteBottle(bottles[j])) ? j : -1;
          render();
          // the filled bottle's surface wobbles and settles
          var newDst = boardEl.children[j];
          if (newDst) {
            newDst.classList.add('settle');
            setTimeout(function () { newDst.classList.remove('settle'); }, 650);
          }
          if (justDoneIdx >= 0) {
            sndDone();
            setTimeout(function () { justDoneIdx = -1; render(); }, 750);
          }
          if (isSolvedState(bottles)) setTimeout(showWin, 450);
        }, 1020);
      }

      function showWin() {
        sndWin();
        winText.textContent = 'レベル ' + level + ' をそろえたよ';
        winOverlay.hidden = false;
        // confetti
        var palette = COLORS.slice(0, LEVEL_COLORS[level - 1]);
        for (var k = 0; k < 36; k++) {
          var piece = document.createElement('span');
          piece.className = 'confetti';
          piece.style.left = Math.random() * 100 + '%';
          piece.style.background = palette[k % palette.length].c;
          piece.style.animationDuration = (1.1 + Math.random() * 1.2) + 's';
          piece.style.animationDelay = (Math.random() * 0.5) + 's';
          winCard.appendChild(piece);
          (function (p) { setTimeout(function () { p.remove(); }, 3200); })(piece);
        }
        var nextBtn = document.getElementById('nextBtn');
        nextBtn.textContent = level >= MAX_LEVEL ? 'レベル1にもどる →' : '次のレベルへ →';
      }

      /* ---------------- Controls ---------------- */
      /* ---------------- Overflow menu ---------------- */
      var menuEl = document.getElementById('menu');
      var menuBtn = document.getElementById('menuBtn');
      function closeMenu() {
        menuEl.hidden = true;
        menuBtn.setAttribute('aria-expanded', 'false');
      }
      menuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willOpen = menuEl.hidden;
        menuEl.hidden = !willOpen;
        menuBtn.setAttribute('aria-expanded', String(willOpen));
      });
      document.addEventListener('click', function (e) {
        if (!menuEl.hidden && !menuEl.contains(e.target)) closeMenu();
      });

      undoBtn.addEventListener('click', function () {
        if (animating || undoStack.length === 0) return;
        var snap = undoStack.pop();
        bottles = snap.bottles; extraUsed = snap.extraUsed;
        selected = -1; justDoneIdx = -1;
        winOverlay.hidden = true;
        render();
      });
      document.getElementById('restartBtn').addEventListener('click', function () {
        closeMenu();
        if (animating) return;
        bottles = deepCopy(initialBottles);
        selected = -1; undoStack = []; extraUsed = false; justDoneIdx = -1;
        winOverlay.hidden = true;
        render();
      });
      document.getElementById('newBtn').addEventListener('click', function () {
        closeMenu();
        if (animating) return;
        startLevel(level);
      });
      levelSelect.addEventListener('change', function () {
        startLevel(parseInt(levelSelect.value, 10));
      });
      document.getElementById('soundBtn').addEventListener('click', function () {
        soundOn = !soundOn;
        this.textContent = soundOn ? '音：ON' : '音：OFF';
        this.setAttribute('aria-pressed', String(soundOn));
        if (soundOn) sndSelect();
      });
      document.getElementById('nextBtn').addEventListener('click', function () {
        startLevel(level >= MAX_LEVEL ? 1 : level + 1);
      });
      document.getElementById('againBtn').addEventListener('click', function () {
        winOverlay.hidden = true;
        bottles = deepCopy(initialBottles);
        selected = -1; undoStack = []; extraUsed = false; justDoneIdx = -1;
        render();
      });

      startLevel(1);
    </script>
  </body>
</html>
