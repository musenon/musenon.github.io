<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ゲーム置き場</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    background: linear-gradient(160deg, #ffeef7 0%, #e8f4ff 100%);
    color: #4a4458;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 20px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; letter-spacing: .05em; }
  .sub { color: #8a84a0; font-size: .9rem; margin-bottom: 36px; }
  .games { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  a.game {
    display: block; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.85);
    border: 2px solid #ffd7ea; border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(255, 160, 200, .18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.game:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 160, 200, .28); }
  .game .name { font-size: 1.15rem; font-weight: 700; }
  .game .desc { font-size: .85rem; color: #8a84a0; margin-top: 4px; }
  footer { margin-top: 44px; font-size: .78rem; color: #b3aecd; }
</style>
</head>
<body>
  <h1>ゲーム置き場</h1>
  <div class="sub">作ったゲームを置いている場所です</div>
  <div class="games">
    <a class="game" href="iromizu/">
      <div class="name">色水ソート</div>
      <div class="desc">色のついた水を瓶に分けていくパズルゲーム</div>
    </a>
  </div>
  <footer>これから少しずつ増える予定</footer>
</body>
</html>
